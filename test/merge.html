<!doctype html><meta charset="utf-8"><title>merge</title>
<script>
const module = { exports: {} };
window.Buffer = { from: (x) => new Uint8Array(x) };
const fakeFs = { promises: { readFile: async (p) => new Uint8Array(await (await fetch(p)).arrayBuffer()) } };
function require(n){ if (n === 'obsidian') return { Plugin: class {}, PluginSettingTab: class {}, Component: class {}, normalizePath: (p) => p }; if (n === 'fs') return fakeFs; throw new Error(n); }
</script>
<script src="../main.js"></script>
<script>
(async () => {
  const P = module.exports, p = new P();
  p.manifest = { dir: '..' };
  p.app = { vault: { adapter: { read: async (path) => (await fetch(path)).text() } } };
  p.log = (m) => console.log(m);
  const outline = [{ id: 'g0', title: '1  Chapter one', children: [{ id: 'n0', title: '1.1  First note' }, { id: 'n1', title: '1.2  Second note' }] }, { id: 'g1', title: '2  Chapter two', children: [{ id: 'n2', title: '2.1  Third' }] }];
  const pages = { g0: 2, n0: 3, n1: 40, g1: 370, n2: 371 };
  const t0 = performance.now();
  const out = await p.mergePdfs(['a.pdf', 'b.pdf'], outline, pages, (m) => console.log(m));
  const ms = Math.round(performance.now() - t0);
  // Re-read the merged file with our own parser to check pages + bookmarks.
  const info = pdfHeadingPages(out);
  const PDFLib = p.PDFLib, back = await PDFLib.PDFDocument.load(out);
  window.result = { ms, mb: +(out.length / 1048576).toFixed(1), pages: back.getPageCount(), bookmarks: info && [...info.headings.entries()] };
  window.mergedUrl = URL.createObjectURL(new Blob([out], { type: 'application/pdf' }));
})().catch((e) => window.result = { err: String(e && e.stack || e) });
</script>
